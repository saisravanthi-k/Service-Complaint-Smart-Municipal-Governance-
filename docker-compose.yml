version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: service_complaint_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_complaint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_complaint_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: service_complaint_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/service_complaint_db
      SECRET_KEY: supersecretkey_municipal_complaint_portal_2026_change_in_prod
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: service_complaint_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: service_complaint_dashboard
    environment:
      BACKEND_URL: http://backend:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
